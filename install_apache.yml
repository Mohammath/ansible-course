---

- hosts: all
  become: true
  tasks:

  - name: Install Apache2 (httpd on Redhat-based varients) Package
    ansible.builtin.dnf:
      name: httpd
      state: present
    
  - name: Start and Enable httpd service
    ansible.builtin.systemd:
      name: httpd
      state: started
      enabled: true    
